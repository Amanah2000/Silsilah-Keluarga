<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silsilah TAU</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{font-family:Consolas,monospace;box-sizing:border-box}
body{margin:0;border:2px solid #000}
.tabs{display:flex}.tabs button{flex:1;padding:14px;border:1.5px solid #000;background:#fff;font-weight:bold}
.tabs button.active{background:#000;color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #000}
.row img{width:48px;height:48px;border:1.5px solid #000;object-fit:cover}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center}
.modal-box{background:#fff;border:2px solid #000;padding:16px;width:92%;max-width:380px}
.modal-box input{width:100%;border:1.5px solid #000;padding:10px;margin:6px 0}
.preview{width:90px;height:90px;border:1.5px dashed #000;object-fit:cover;display:block;margin:8px 0}
</style>
</head>
<body>
<div class="tabs">
<button id="bData" class="active" onclick="switchTab('data')">DATA</button>
<button id="bPohon" onclick="switchTab('pohon')">POHON</button>
</div>

<div id="dataWrap">
<div style="padding:8px;border-bottom:1.5px solid #000;display:flex;gap:8px">
<input id="cari" placeholder="Cari nama..." oninput="render()" style="flex:1;border:1.5px solid #000;padding:10px">
</div>
<div style="padding:8px;display:flex;gap:8px;border-bottom:2px solid #000">
<input id="namaBaru" placeholder="Nama Baru" style="flex:1;border:1.5px solid #000;padding:10px">
<button onclick="tambah()" style="background:#000;color:#fff;padding:10px 16px;border:none">+ Tambah</button>
</div>
<div id="list"></div>
</div>

<div id="pohonWrap" style="display:none;padding:12px;overflow:auto"><div id="pohonView"></div></div>

<!-- MODAL EDIT -->
<div id="modal" class="modal" onclick="if(event.target==this)closeModal()">
<div class="modal-box">
<h3 style="margin:0 0 10px">Edit Anggota</h3>
<input id="e_nama" placeholder="Nama Lengkap">
<input id="e_ayah" placeholder="Nama Ayah (ketik persis)">
<input id="e_ibu" placeholder="Nama Ibu">
<label style="font-size:12px;font-weight:bold">PASANGAN Pak (suami/istri):</label>
<input id="e_pasangan" placeholder="Nama Pasangan Pak">
<label style="font-size:12px;font-weight:bold">TGL LAHIR Pak (klik kalender Pak):</label>
<input id="e_tgl" type="date">
<label style="font-size:12px;font-weight:bold">FOTO Pak (pilih dari HP Pak):</label>
<input id="e_file" type="file" accept="image/*" onchange="previewFoto(this)">
<img id="e_preview" class="preview" src="" style="display:none">
<input id="e_foto_url" type="hidden">
<div style="display:flex;gap:8px;margin-top:12px">
<button onclick="simpanEdit()" style="flex:1;background:#000;color:#fff;padding:12px;border:none;font-weight:bold">SIMPAN</button>
<button onclick="closeModal()" style="flex:1;background:#fff;border:1.5px solid #000;padding:12px">Batal</button>
</div>
</div>
</div>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://aftvoyxwsmdcedvxehuh.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmdHZveXh3c21kY2VkdnhlaHVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMjQ4NzcsImV4cCI6MjEwNTcwMDg3N30.QERB57Nn6mTbUSKWwzVI_a6BVjxt9s77hV_IJFsHstM";
let supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let data=[]; let editIdx=-1;
async function load(){
 let {data:d}=await supa.from("anggota").select("*").order("id");
 data=d||[]; render(); renderPohon();
}
function render(){
 let q=(document.getElementById("cari").value||"").toLowerCase();
 let list=document.getElementById("list"); list.innerHTML="";
 data.filter(x=>(x.nama||"").toLowerCase().includes(q)).forEach(r=>{
  let idx=data.indexOf(r);
  let img=r.foto_url?`<img src="${r.foto_url}">`:`<div style="width:48px;height:48px;border:1.5px solid #000;display:flex;align-items:center;justify-content:center">?</div>`;
  let tgl=r.tgl_lahir?`<div style="font-size:11px;opacity:.7">${r.tgl_lahir}</div>`:"";
  let div=document.createElement("div"); div.className="row";
  div.innerHTML=`${img}<div style="flex:1"><b>${r.nama}</b>${tgl}<div style="font-size:11px">ayah:${r.ayah||"-"}</div></div><button onclick="openEdit(${idx})" style="border:1.5px solid #000;background:#fff;padding:6px 12px">Edit</button><button onclick="hapus(${idx})" style="border:1.5px solid #000;background:#fff;padding:6px">X</button>`;
  list.appendChild(div);
 });
}
function previewFoto(inp){
 let file=inp.files[0]; if(!file)return;
 let reader=new FileReader();
 reader.onload=e=>{
  document.getElementById("e_preview").src=e.target.result;
  document.getElementById("e_preview").style.display="block";
  document.getElementById("e_foto_url").value=e.target.result; // simpan base64 Pak, nggak perlu link Pak!
 };
 reader.readAsDataURL(file);
}
function openEdit(idx){
 editIdx=idx; let r=data[idx];
 document.getElementById("e_nama").value=r.nama||"";
 document.getElementById("e_ayah").value=r.ayah||"";
 document.getElementById("e_ibu").value=r.ibu||"";
 document.getElementById('e_pasangan').value
 document.getElementById("e_tgl").value=r.tgl_lahir||"";
 document.getElementById("e_foto_url").value=r.foto_url||"";
 let prev=document.getElementById("e_preview");
 if(r.foto_url){ prev.src=r.foto_url; prev.style.display="block"; } else prev.style.display="none";
 document.getElementById("modal").style.display="flex";
}
function closeModal(){ document.getElementById("modal").style.display="none"; }
async function simpanEdit(){
 let r=data[editIdx];
 let baru={
  nama:document.getElementById("e_nama").value.trim(),
  ayah:document.getElementById("e_ayah").value.trim(),
  ibu:document.getElementById("e_ibu").value.trim(),
  pasangan: document.getElementById('e_pasangan').value
  tgl_lahir:document.getElementById("e_tgl").value||null,
  foto_url:document.getElementById("e_foto_url").value||null
 };
 if(r.id) await supa.from("anggota").update(baru).eq("id",r.id);
 data[editIdx]={...r,...baru};
 closeModal(); render(); renderPohon();
}
async function tambah(){
 let nama=document.getElementById("namaBaru").value.trim(); if(!nama)return;
 let {data:d}=await supa.from("anggota").insert([{nama}]).select();
 if(d&&d[0]) data.push(d[0]); else data.push({nama});
 document.getElementById("namaBaru").value=""; render(); renderPohon();
}
async function hapus(idx){ if(!confirm("Hapus?"))return; let r=data[idx]; if(r.id) await supa.from("anggota").delete().eq("id",r.id); data.splice(idx,1); render(); renderPohon(); }

function buildTree(){
 let map={}; data.forEach(d=>{ map[d.nama]= {...d, children:[]}; });
 data.forEach(d=>{ if(d.ayah &&!map[d.ayah]) map[d.ayah]={nama:d.ayah, children:[], placeholder:true}; });
 Object.values(map).forEach(n=>{ if(n.ayah && map[n.ayah] && n.nama!=map[n.ayah].nama) map[n.ayah].children.push(n); });
 return Object.values(map).filter(n=>!n.ayah ||!map[n.ayah]);
}
function nodeHTML(node,isRoot){
 let foto=node.foto_url?`<img src="${node.foto_url}" style="width:40px;height:40px;border:1.5px solid #000;object-fit:cover;display:block;margin:0 auto 4px">`:"";
 let tgl=node.tgl_lahir?`<div style="font-size:9px;opacity:.6">${node.tgl_lahir}</div>`:"";
 let childs=node.children&&node.children.length?`<div style="display:flex;gap:12px;margin-top:20px">${node.children.map(c=>`<div>${nodeHTML(c,false)}</div>`).join("")}</div>`:"";
 return `<div style="display:flex;flex-direction:column;align-items:center"><div style="border:2px solid #000;padding:6px 10px;background:${isRoot?'#000':'#fff'};color:${isRoot?'#fff':'#000'};text-align:center;min-width:90px;font-size:11px;font-weight:bold">${foto}${node.nama}${tgl}</div>${childs}</div>`;
}
function renderPohon(){
 let roots=buildTree(); let wahyudi=roots.find(r=>r.nama.toLowerCase().includes("wahyudi")); if(wahyudi) roots=[wahyudi];
 document.getElementById("pohonView").innerHTML=roots.map(r=>nodeHTML(r,true)).join("<br><br>");
}
function switchTab(t){
 document.getElementById("bData").classList.toggle("active",t=="data");
 document.getElementById("bPohon").classList.toggle("active",t=="pohon");
 document.getElementById("dataWrap").style.display=t=="data"?"block":"none";
 document.getElementById("pohonWrap").style.display=t=="pohon"?"block":"none";
 if(t=="pohon") renderPohon();
}
load();
</script>
</body>
</html>
