<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silsilah TAU - Final Fix</title>
<style>
*{font-family:Consolas,monospace;box-sizing:border-box}
body{margin:0;border:2px solid #000}
.tabs{display:flex}.tabs button{flex:1;padding:14px;border:1.5px solid #000;background:#fff;font-weight:bold;cursor:pointer}
.tabs button.active{background:#000;color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #000}
.row img{width:48px;height:48px;border:1.5px solid #000;object-fit:cover}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;overflow:auto;padding:10px}
.modal-box{background:#fff;border:2px solid #000;padding:16px;width:92%;max-width:420px;max-height:90vh;overflow:auto}
.modal-box input{width:100%;border:1.5px solid #000;padding:10px;margin:6px 0}
.preview{width:90px;height:90px;border:1.5px dashed #000;object-fit:cover;display:block;margin:8px 0}
</style>
</head>
<body>
<div class="tabs">
<button id="bData" class="active" onclick="switchTab('data')">DATA</button>
<button id="bPohon" onclick="switchTab('pohon')">POHON</button>
</div>
<div id="dataWrap">
<div style="padding:8px;border-bottom:1.5px solid #000;display:flex;gap:8px">
<input id="cari" placeholder="Cari nama..." oninput="render()" style="flex:1;border:1.5px solid #000;padding:10px">
</div>
<div style="padding:8px;display:flex;gap:8px;border-bottom:2px solid #000">
<input id="namaBaru" placeholder="Nama Baru" style="flex:1;border:1.5px solid #000;padding:10px">
<button onclick="tambah()" style="background:#000;color:#fff;padding:10px 16px;border:none;cursor:pointer">+ Tambah</button>
</div>
<div id="list"></div>
</div>
<div id="pohonWrap" style="display:none;padding:12px;overflow:auto"><div id="pohonView"></div></div>
<div id="modal" class="modal" onclick="if(event.target==this)closeModal()">
<div class="modal-box">
<h3 style="margin:0 0 10px">Edit Anggota</h3>
<input id="e_nama" placeholder="Nama Lengkap">
<input id="e_ayah" placeholder="Nama Ayah">
<input id="e_ibu" placeholder="Nama Ibu">
<hr>
<label style="font-size:12px;font-weight:bold;background:#ffe">PASANGAN</label>
<input id="e_pasangan" placeholder="Nama Pasangan">
<label style="font-size:12px;font-weight:bold">TGL LAHIR Pasangan:</label>
<input id="e_tgl_pasangan" type="date">
<label style="font-size:12px;font-weight:bold">FOTO Pasangan:</label>
<input id="e_file_pasangan" type="file" accept="image/*" onchange="previewFotoPasangan(this)">
<img id="e_preview_pasangan" class="preview" src="" style="display:none">
<input id="e_foto_pasangan_url" type="hidden">
<button type="button" onclick="hapusFotoPasanganPak()" style="width:100%;background:#ffcccc;border:1.5px solid #000;padding:8px;font-weight:bold">HAPUS FOTO PASANGAN</button>
<hr>
<label style="font-size:12px;font-weight:bold">TGL LAHIR Sendiri:</label>
<input id="e_tgl" type="date">
<label style="font-size:12px;font-weight:bold">FOTO Sendiri:</label>
<input id="e_file" type="file" accept="image/*" onchange="previewFoto(this)">
<img id="e_preview" class="preview" src="" style="display:none">
<button type="button" onclick="hapusFotoPak()" style="width:100%;margin-top:8px;background:#ffcccc;border:1.5px solid #000;padding:8px;font-weight:bold">HAPUS FOTO SENDIRI</button>
<input id="e_foto_url" type="hidden">
<div style="display:flex;gap:8px;margin-top:12px">
<button onclick="simpanEdit()" style="flex:1;background:#000;color:#fff;padding:12px;border:none;font-weight:bold">SIMPAN</button>
<button onclick="closeModal()" style="flex:1;background:#fff;border:1.5px solid #000;padding:12px">Batal</button>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://aftvoyxwsmdcedvxehuh.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmdHZveXh3c21kY2VkdnhlaHVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMjQ4NzcsImV4cCI6MjEwNTcwMDg3N30.QERB57Nn6mTbUSKWwzVI_a6BVjxt9s77hV_IJFsHstM";
let supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let data=[]; let editIdx=-1;
async function load(){
 let {data:d} = await supa.from("anggota").select("*").order("tgl_lahir", {ascending: true});
 data=d||[];
 render();
 renderPohon();
}

function render(){
  let q=(document.getElementById("cari").value||"").toLowerCase();
  let list=document.getElementById("list"); list.innerHTML="";
  let filtered=data.filter(x=>(x.nama||"").toLowerCase().includes(q));
  let sorted=[...filtered].sort((a,b)=>(a.tgl_lahir||'9999').localeCompare(b.tgl_lahir||'9999'));
  // PAKSA ROCHAYANIK URUTAN 3 DI DATA
  if(!q){
    let i=sorted.findIndex(x=>x.nama.toLowerCase().includes('rochayanik'));
    if(i>2){let [r]=sorted.splice(i,1); sorted.splice(2,0,r);}
  }
  sorted.forEach(r=>{
    let idx=data.indexOf(r);
    let img=r.foto_url?`<img src="${r.foto_url}" style="width:48px;height:48px;border:1.5px solid #000">`:`<div style="width:48px;height:48px;border:1.5px solid #000;background:#eee"></div>`;
    let img2=r.foto_pasangan_url?`<img src="${r.foto_pasangan_url}" style="width:48px;height:48px;border:1.5px solid #b00">`:`<div style="width:48px;height:48px;border:1.5px dashed #f99"></div>`;
    let div=document.createElement("div"); div.className="row";
    div.innerHTML=`${img}${img2}<div style="flex:1"><b>${r.nama}</b><div style="font-size:11px">🎂 ${r.tgl_lahir||'-'} | ayah:${r.ayah||'-'} ibu:${r.ibu||'-'}</div><div style="font-size:11px">💑 ${r.pasangan||'-'}</div></div><button onclick="openEdit(${idx})">Edit</button>`;
    list.appendChild(div);
  });
}

function buildTree(){
  let map={};
  data.forEach(d=>{map[d.nama.toLowerCase().trim()]={...d, children:[]}});
  let jadiAnak=new Set();
  data.forEach(d=>{
    let a=(d.ayah||'').toLowerCase().trim();
    let i=(d.ibu||'').toLowerCase().trim();
    let parent = map[a] || map[i] || null;
    // kalau ibu = Nurhidayati, cari suaminya Masduki
    if(!parent && i){
      Object.values(map).forEach(p=>{
        if(p.pasangan && p.pasangan.toLowerCase().trim()==i) parent=p;
      });
    }
    if(!parent && a){
      Object.values(map).forEach(p=>{
        if(p.pasangan && p.pasangan.toLowerCase().trim()==a) parent=p;
      });
    }
    let me=d.nama.toLowerCase().trim();
    if(parent && parent.nama.toLowerCase().trim()!=me){
      parent.children.push(map[me]);
      jadiAnak.add(me);
    }
  });
  let roots=Object.values(map).filter(n=>!jadiAnak.has(n.nama.toLowerCase().trim()));
  roots.forEach(r=>r.children.sort((a,b)=>(a.tgl_lahir||'9999').localeCompare(b.tgl_lahir||'9999')));
  return roots.sort((a,b)=>(a.tgl_lahir||'9999').localeCompare(b.tgl_lahir||'9999'));
}

function nodeHTML(node,isRoot){
  let foto1=node.foto_url?`<img src="${node.foto_url}" style="width:60px;height:60px;border:1.5px solid #000;object-fit:cover">`:`<div style="width:60px;height:60px;border:1.5px dashed #aaa;display:flex;align-items:center;justify-content:center;font-size:8px">NO FOTO</div>`;
  let foto2=node.foto_pasangan_url?`<img src="${node.foto_pasangan_url}" style="width:60px;height:60px;border:1.5px solid #b00;object-fit:cover">`:`<div style="width:60px;height:60px;border:1.5px dashed #f99;display:flex;align-items:center;justify-content:center;font-size:8px">NO FOTO</div>`;
  let block1=`<div style="display:flex;flex-direction:column;align-items:center;width:80px;text-align:center;gap:2px">${foto1}<b style="font-size:10px;line-height:11px;word-break:break-word">${node.nama}</b><span style="font-size:9px">${node.tgl_lahir||''}</span></div>`;
  let block2=node.pasangan?`<div style="display:flex;flex-direction:column;align-items:center;width:80px;text-align:center;gap:2px">${foto2}<b style="font-size:10px;line-height:11px;color:#b00;word-break:break-word">${node.pasangan}</b><span style="font-size:9px;color:#b00">${node.tgl_lahir_pasangan||''}</span></div>`:"";
  // garis penghubung
  let childs=node.children&&node.children.length?`<div style="border-top:2px solid #000;margin-top:12px;padding-top:12px;display:flex;gap:20px;justify-content:center;flex-wrap:wrap">${node.children.map(c=>`<div>${nodeHTML(c,false)}</div>`).join("")}</div>`:"";
  return `<div style="display:flex;flex-direction:column;align-items:center"><div style="border:2px solid #000;padding:10px 12px;background:${isRoot?'#ffe':'#fff'};min-width:190px"><div style="display:flex;gap:16px;justify-content:center;align-items:flex-start">${block1}${block2}</div></div>${childs}</div>`;
}
function switchTab(t){document.getElementById("bData").classList.toggle("active",t=="data"); document.getElementById("bPohon").classList.toggle("active",t=="pohon"); document.getElementById("dataWrap").style.display=t=="data"?"block":"none"; document.getElementById("pohonWrap").style.display=t=="pohon"?"block":"none"; if(t=="pohon") renderPohon();}
load();
</script>
</body>
</html>
