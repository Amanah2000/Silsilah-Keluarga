<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silsilah Tawar - Model Folder Lipat 21 Data</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f1f5f9;color:#1e293b;padding:12px}
.header{background:white;border-radius:14px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.08);margin-bottom:12px;border:1px solid #e2e8f0}
.header h1{font-size:16px;font-weight:800}
.header p{font-size:11px;color:#64748b;margin-top:4px}
.card{background:white;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,0.08);border:1px solid #e2e8f0}
.tree, .children{list-style:none}
.children{margin-left:20px;border-left:2px dashed #cbd5e1;padding-left:12px;display:none}
.children.open{display:block}
.item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;cursor:pointer;margin:3px 0;transition:0.15s;border:1px solid transparent}
.item:hover{background:#f1f5f9;border-color:#e2e8f0}
.item.active{background:#0f172a;color:white;border-color:#0f172a}
.icon{font-size:16px;min-width:22px;text-align:center}
.name{font-size:13px;font-weight:700;line-height:1.2}
.meta{font-size:10px;color:#64748b;font-weight:400;display:block;margin-top:2px}
.item.active .meta{color:#cbd5e1}
.badge{margin-left:auto;font-size:9px;padding:3px 7px;border-radius:20px;background:#e2e8f0;color:#475569;white-space:nowrap}
.item.active .badge{background:rgba(255,255,255,0.2);color:white}
.leaf .item{background:#f8fafc;border:1px dashed #e2e8f0}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:2px}
.hint{background:#fef9c3;border:1px solid #fde047;color:#854d0e;padding:8px;border-radius:8px;font-size:11px;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="header">
<h1>📁 Silsilah Keluarga Tawar - POHON</h1>
<p>Total: 21 data - Klik Nama Ayah Untuk Lihat Anaknya Pak</p>
</div>
<div class="card">
<ul class="tree" id="tree"></ul>
<div class="hint">💡 Klik folder 📁 pak untuk buka lipatan nya pak. Klik lagi untuk tutup!</div>
</div>
<script>
const silsilah = {
 name: "Masduki + Nurhidayati", meta: "Akar Keluarga",
 children: [
  { name: "Wahyudi + Khalimatus Sa'diyah", meta: "06-81965 & 31-03-1068",
   children: [
    { name: "Aditya Shufi Mubarok + Asfiana", meta: "Anak 1",
     children: [
      { name: "Azalia Nada Hibatulla", leaf:true },
      { name: "Ahmad Romadlon", leaf:true, no:"2." },
      { name: "Muh. Hafidz", leaf:true, no:"3." },
      { name: "Moh. Husain", leaf:true, no:"4." }
     ]
    },
    { name: "Churotul Aini + Fuad Amrozi", meta: "Anak 2",
     children: [
      { name: "Umar", meta:"2010-01-01", leaf:true, no:"1." },
      { name: "Fatimah", meta:"2010-01-02", leaf:true, no:"2." }
     ]
    },
    { name: "Muhammad Ja'far Shodiq + Virdayani", meta:"Anak 3", children: [] },
    { name: "Ahmad Mujahid Alfata'ki", meta:"Anak 4", children: [] }
   ]
  },
  { name: "Rochayanik + Awet Setiawan", meta: "Cabang 2",
   children: [
    { name: "Abidzar", leaf:true, no:"1." },
    { name: "Azar", leaf:true, no:"2." }
   ]
  }
 ]
};
function makeNode(node){
 const li=document.createElement('li'); const isLeaf=node.leaf;
 li.className=isLeaf?'leaf':'folder';
 const div=document.createElement('div'); div.className='item';
 const icon=isLeaf?'👤':'📁'; const metaHtml=node.meta?`<span class="meta">${node.meta}</span>`:'';
 const prefix=node.no?node.no+' ':''; const badge=isLeaf?'<span class="badge"><span class="dot"></span>Santri</span>':`<span class="badge">${node.children?node.children.length:0} anak</span>`;
 div.innerHTML=`<span class="icon">${icon}</span><span><span class="name">${prefix}${node.name}</span>${metaHtml}</span>${badge}`;
 li.appendChild(div);
 if(!isLeaf && node.children && node.children.length>0){
   const ul=document.createElement('ul'); ul.className='children';
   node.children.forEach(c=> ul.appendChild(makeNode(c))); li.appendChild(ul);
   div.addEventListener('click',(e)=>{e.stopPropagation(); const open=ul.classList.toggle('open'); div.classList.toggle('active',open); div.querySelector('.icon').textContent=open?'📂':'📁';});
 }
 return li;
}
const root=document.getElementById('tree'); const rootNode=makeNode(silsilah); root.appendChild(rootNode);
rootNode.querySelector('.item').classList.add('active'); rootNode.querySelector('.children').classList.add('open'); rootNode.querySelector('.item .icon').textContent='📂';
</script>
</body>
</html>
