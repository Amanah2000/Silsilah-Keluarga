<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>POHON KECIL</title>
<style>
*{font-family:Consolas,monospace;box-sizing:border-box}
body{margin:0}
.tabs{display:flex;position:sticky;top:0;z-index:10}
.tabs button{flex:1;padding:12px;border:1px solid #000;background:#fff;font-weight:bold}
.tabs button.active{background:#000;color:#fff}
#pohonView{padding:10px;overflow:auto;min-height:80vh}
.node-box{border:1px solid #000;padding:3px;background:#fff;display:inline-block}
.node-box.root{border:1.5px solid #000;background:#ffffe0}
.node-foto{width:26px;height:26px;border:1px solid #000;object-fit:cover;cursor:pointer;display:block}
.node-foto.pasangan{border:1px solid #b00}
.node-no{width:26px;height:26px;border:1px dashed #999;display:flex;align-items:center;justify-content:center;font-size:5px}
.node-n{font-size:7px;font-weight:bold;max-width:50px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.node-t{font-size:6px;text-align:center}
#fotoModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;align-items:center;justify-content:center}
#fotoModal img{max-width:92%;max-height:88%;border:3px solid #fff}
.row{display:flex;gap:8px;padding:8px;border-bottom:1px solid #000;align-items:center}
</style>
</head>
<body>
<div class="tabs"><button id="bData" class="active" onclick="switchTab('data')">DATA</button><button id="bPohon" onclick="switchTab('pohon')">POHON</button></div>
<div id="dataWrap"><input id="cari" placeholder="Cari..." oninput="render()" style="width:100%;padding:10px;border:1px solid #000"><div id="list"></div></div>
<div id="pohonWrap" style="display:none"><div id="pohonView"></div></div>
<div id="fotoModal" onclick="this.style.display='none'"><img id="fotoBig" src=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://aftvoyxwsmdcedvxehuh.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmdHZveXh3c21kY2VkdnhlaHVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMjQ4NzcsImV4cCI6MjEwNTcwMDg3N30.QERB57Nn6mUzVI_a6BVjxt9s77hV_IJFsHstM";
let supa=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let data=[];
function showFoto(u){if(!u)return;document.getElementById('fotoBig').src=u;document.getElementById('fotoModal').style.display='flex';}
async function load(){let r=await supa.from('anggota').select('*');data=r.data||[];render();renderPohon();}
function render(){
 let q=(document.getElementById('cari').value||'').toLowerCase();
 let list=document.getElementById('list');list.innerHTML='';
 let f=data.filter(x=>(x.nama||'').toLowerCase().includes(q));
 let s=[...f].sort((a,b)=>(a.tgl_lahir||'9999').localeCompare(b.tgl_lahir||'9999'));
 if(!q){let i=s.findIndex(x=>x.nama.toLowerCase().includes('rochayanik'));if(i>2){let[t]=s.splice(i,1);s.splice(2,0,t);}}
 let l=document.getElementById('list');s.forEach(d=>{let div=document.createElement('div');div.className='row';div.innerHTML=`<b>${d.nama}</b> <small>${d.tgl_lahir||''} ayah:${d.ayah||'-'}</small>`;list.appendChild(div);});
}
function buildTree(){
 let map={};data.forEach(d=>{map[d.nama.toLowerCase().trim()]={...d,children:[]}});
 let anak=new Set();
 data.forEach(d=>{
  let me=d.nama.toLowerCase().trim();let a=(d.ayah||'').toLowerCase().trim();let ib=(d.ibu||'').toLowerCase().trim();
  let p=map[a]||map[ib]||null;
  if(!p&&ib){Object.values(map).forEach(x=>{if(x.pasangan&&x.pasangan.toLowerCase().trim()==ib)p=x;});}
  if(p&&p.nama.toLowerCase().trim()!=me){p.children.push(map[me]);anak.add(me);}
 });
 return Object.values(map).filter(n=>!anak.has(n.nama.toLowerCase().trim()));
}
function nodeHTML(node){
 let f1=node.foto_url?`<img src="${node.foto_url}" class="node-foto" onclick="showFoto('${node.foto_url}')">`:`<div class="node-no">NO FOTO</div>`;
 let f2=node.foto_pasangan_url?`<img src="${node.foto_pasangan_url}" class="node-foto pasangan" onclick="showFoto('${node.foto_pasangan_url}')">`:`<div class="node-no" style="border-color:#f99">NO FOTO</div>`;
 let b1=`<div style="display:flex;flex-direction:column;align-items:center">${f1}<div class="node-n">${node.nama}</div><div class="node-t">${(node.tgl_lahir||'').slice(0,10)}</div></div>`;
 let b2=node.pasangan?`<div style="display:flex;flex-direction:column;align-items:center">${f2}<div class="node-n" style="color:#b00">${node.pasangan}</div><div class="node-t" style="color:#b00">${(node.tgl_lahir_pasangan||'').slice(0,10)}</div></div>`:'';
 let kids='';
 if(node.children&&node.children.length){
  node.children.sort((a,b)=>(a.tgl_lahir||'').localeCompare(b.tgl_lahir||''));
  kids=`<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px">${node.children.map(c=>nodeHTML(c)).join('')}</div>`;
 }
 return `<div style="display:flex;flex-direction:column;align-items:center"><div class="node-box ${node.nama.toLowerCase().includes('masduki')?'root':''}"><div style="display:flex;gap:5px">${b1}${b2}</div></div>${node.children&&node.children.length?`<div style="width:1px;height:8px;background:#000"></div>${kids}`:''}</div>`;
}
function renderPohon(){
 try{
  let roots=buildTree();
  let m=roots.find(r=>r.nama.toLowerCase().includes('masduki'));
  if(m){document.getElementById('pohonView').innerHTML=`<div style="display:flex;justify-content:center">${nodeHTML(m)}</div>`;}
  else{document.getElementById('pohonView').innerHTML=roots.map(r=>`<div style="margin-bottom:10px;display:flex;justify-content:center">${nodeHTML(r)}</div>`).join('');}
 }catch(e){document.getElementById('pohonView').innerHTML='Error: '+e.message;}
}
function switchTab(t){document.getElementById('bData').classList.toggle('active',t=='data');document.getElementById('bPohon').classList.toggle('active',t=='pohon');document.getElementById('dataWrap').style.display=t=='data'?'block':'none';document.getElementById('pohonWrap').style.display=t=='pohon'?'block':'none';if(t=='pohon')renderPohon();}
load();
</script>
</body></html>
