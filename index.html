<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silsilah Keluarga Tawar</title>
<style>
body{font-family:Arial;background:#fff;padding:15px;margin:0}
#total{font-weight:bold}
.judul{font-size:20px;font-weight:bold;text-align:center;margin:15px 0}
.pohon{text-align:center;overflow-x:auto;padding-bottom:20px}

.garis-v{width:3px;height:20px;background:#000;margin:0 auto}
.garis-h{height:3px;background:#000;margin:0 auto}

.kotak{border:2px solid #000;background:#fff;border-radius:8px;
       display:flex;align-items:center;justify-content:center;
       text-align:center;box-sizing:border-box}

/* LEVEL 1 */
.l1 .kotak{width:320px;height:38px;margin:0 auto;font-weight:bold}

/* LEVEL 2 */
.l2{display:flex;justify-content:center;gap:20px;margin-top:0}
.l2 .kotak{width:320px;height:42px;font-size:13px}

/* LEVEL 3 */
.l3{display:flex;justify-content:center;gap:12px;margin-top:0}
.l3 .kotak{width:200px;height:42px;font-size:11px}

/* LEVEL 4 cucu */
.l4{display:flex;justify-content:center;gap:10px;margin-top:0}
.anak-wrap{display:flex;gap:6px;justify-content:center;border-top:3px solid #000;padding-top:10px;margin-top:0}
.anak{width:95px;height:42px;border:2px solid #000;border-radius:6px;
      display:flex;align-items:center;justify-content:center;
      font-size:10px;text-align:center;padding:3px;box-sizing:border-box;background:#fff}
</style>
</head>
<body>
<div id="total">Total: 21 data - OK</div>
<div class="judul">Silsilah Keluarga Tawar - POHON</div>
<div class="pohon" id="pohon"></div>

<script>
function render(){
 const el=document.getElementById('pohon');
 if(!el) return;
 el.innerHTML=`
  <div class="l1"><div class="kotak">Masduki + Nurhidayati</div></div>
  <div class="garis-v"></div>
  <div class="garis-h" style="width:70%"></div>
  
  <div class="l2">
    <div><div class="kotak">Wahyudi + Khalimatus Sa'diyah</div><div class="garis-v"></div><div class="garis-h"></div></div>
    <div><div class="kotak" style="width:180px">Rochayanik + Awet Setiawan</div><div class="garis-v"></div><div class="garis-h"></div></div>
  </div>

  <div class="l3">
    <div style="text-align:center">
      <div class="kotak">Aditya Shufil Mubarok + Asfiana</div>
      <div class="garis-v"></div>
      <div class="garis-h"></div>
      <div class="anak-wrap">
        <div class="anak">1. Azalia Nada Hibatulla</div>
        <div class="anak">2. Ahmad Romadlon</div>
        <div class="anak">3. Muh. Hafidz</div>
        <div class="anak">4. Moh. Husain</div>
      </div>
    </div>
    <div style="text-align:center">
      <div class="kotak">Churotul Aini + Fuad Amrozi</div>
      <div class="garis-v"></div>
      <div class="garis-h" style="width:80%"></div>
      <div class="anak-wrap">
        <div class="anak">1. Umar (2010-01-01)</div>
        <div class="anak">2. Fatimah (2010-01-02)</div>
      </div>
    </div>
    <div><div class="kotak">Muhammad Ja'far Shodiq + Virdayani</div></div>
    <div><div class="kotak">Ahmad Mujahid Alfataki</div></div>
    <div style="text-align:center">
      <div style="display:flex;gap:6px;border-top:3px solid #000;padding-top:10px">
        <div class="anak">1. Abidzar</div>
        <div class="anak">2. Azar</div>
      </div>
    </div>
  </div>
 `;
}
document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
