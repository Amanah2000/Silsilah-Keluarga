<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Silsilah TAU</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{font-family:monospace}.tabs{display:flex}.tabs button{flex:1;padding:12px;border:1px solid #000}.active{background:#000;color:#fff}</style>
</head><body>
<div class="tabs"><button id="tabData" class="active" onclick="switchTab('data')">DATA</button><button id="tabPohon" onclick="switchTab('pohon')">POHON</button></div>
<input id="cari" placeholder="Cari nama..." oninput="render()" style="width:100%;border:1.5px solid #000;padding:10px;margin-top:10px">
<div style="display:flex;gap:8px;margin-top:10px"><input id="namaBaru" placeholder="Nama Baru" style="flex:1;border:1.5px solid #000;padding:10px"><button onclick="tambah()" style="background:#000;color:#fff;padding:10px">+ Tambah</button></div>
<div id="list" style="margin-top:16px;border-top:2px solid #000"></div>
<pre id="pohonView" style="display:none;border:1.5px solid #000;padding:12px;min-height:300px;margin-top:12px"></pre>
<script>
const SUPABASE_URL = "https://aftvoyxwsmdcedvxehuh.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmdHZveXh3c21kY2VkdnhlaHVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMjQ4NzcsImV4cCI6MjEwNTcwMDg3N30.QERB57Nn6mTbUSKWwzVI_a6BVjxt9s77hV_IJFsHstM";
let supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let data=[];
async function load(){try{let {data:d}=await supa.from("anggota").select("*").order("id");data=d||[];}catch(e){let l=localStorage.getItem("silsilah_data");if(l)data=JSON.parse(l);}render();}
function render(){let q=(document.getElementById("cari").value||"").toLowerCase();let list=document.getElementById("list");list.innerHTML="";let f=data.filter(x=>(x.nama||"").toLowerCase().includes(q));f.forEach((row,i)=>{let idx=data.indexOf(row);let div=document.createElement("div");div.style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #000";div.innerHTML=`<b>${row.nama}</b><span><button onclick="edit(${idx})">Edit</button> <button onclick="hapus(${idx})">Hapus</button></span>`;list.appendChild(div);});document.getElementById("pohonView").textContent=data.map(r=>`${r.nama} ${r.ayah?`(ayah:${r.ayah})`:""}`).join("\n");}
async function tambah(){let inp=document.getElementById("namaBaru");let nama=inp.value.trim();if(!nama)return;let {data:d}=await supa.from("anggota").insert([{nama}]).select();if(d&&d[0])data.push(d[0]);else data.push({nama});inp.value="";render();}
async function hapus(idx){if(!confirm("Hapus?"))return;let row=data[idx];if(row.id)await supa.from("anggota").delete().eq("id",row.id);data.splice(idx,1);render();}
async function edit(idx){let r=data[idx];let nama=prompt("Nama:",r.nama);if(nama===null)return;let ayah=prompt("Ayah:",r.ayah||"");let ibu=prompt("Ibu:",r.ibu||"");if(row.id)await supa.from("anggota").update({nama,ayah,ibu}).eq("id",r.id);data[idx]={...r,nama,ayah,ibu};render();}
function switchTab(t){document.getElementById("tabData").classList.toggle("active",t==="data");document.getElementById("tabPohon").classList.toggle("active",t==="pohon");document.getElementById("list").style.display=t==="data"?"block":"none";document.getElementById("pohonView").style.display=t==="pohon"?"block":"none";}
load();
</script></body></html>
