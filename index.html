<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silsilah - Fix Putih</title>
<style>
 
*{font-family:Consolas,monospace;box-sizing:border-box}body{margin:0}
.tabs{display:flex;position:sticky;top:0;z-index:10;background:#fff}
.tabs button{flex:1;padding:12px;border:1px solid #000;background:#fff;font-weight:bold}
.tabs button.active{background:#000;color:#fff}
#pohonView{padding:10px;overflow:auto;min-height:90vh;background:#fff;text-align:center}
.node{display:inline-flex;flex-direction:column;align-items:center;margin:3px;vertical-align:top}
.pair{display:flex;gap:3px}
.box{width:54px;border:1.2px solid #000;background:#fff;padding:2px}
.box.dash{border-style:dashed;border-color:#b00}
.box.root{background:#ffffe0}
.box img{width:100%;height:38px;object-fit:cover;border:1px solid #000;display:block}
.box.no{width:100%;height:38px;border:1px dashed #999;display:flex;align-items:center;justify-content:center;font-size:8px}
.box.nm{font-size:7px;font-weight:bold;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.vline{width:1px;height:8px;background:#000;margin:2px auto}
.children{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
#fotoModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;align-items:center;justify-content:center}
#fotoModal img{max-width:92%;max-height:90%;border:3px solid #fff}
#status{padding:6px;font-size:11px;background:#ffe;border-bottom:1px solid #000}
.row{display:flex;gap:6px;padding:6px;border-bottom:1px solid #ccc;font-size:11px;align-items:center}
 /* Garis vertikal dari orang tua ke anak */
.tree-line-v {
  width: 3px;
  height: 30px;
  background: black;
  margin: 0 auto;
}
.tree-line-h {
  height: 3px;
  background: black;
  width: 100%;
}
.children-container {
  display: flex;
  gap: 15px;
  justify-content: center;
  border-top: 3px solid black;
  padding-top: 20px;
  margin-top: 0;
}
</style>
</head>
<body>
<div class="tabs"><button id="bData" class="active" onclick="switchTab('data')">DATA</button><button id="bPohon" onclick="switchTab('pohon')">POHON</button></div>
<div id="dataWrap"><div id="status">Memuat...</div><div id="list"></div></div>
<div id="pohonWrap" style="display:none"><div id="pohonView">Memuat pohon...</div></div>
<div id="fotoModal" onclick="this.style.display='none'"><img id="bigFoto" src=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://aftvoyxwsmdcedvxehuh.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmdHZveXh3c21kY2VkdnhlaHVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMjQ4NzcsImV4cCI6MjEwNTcwMDg3N30.QERB57Nn6mTbUSKWwzVI_a6BVjxt9s77hV_IJFsHstM";
const supa = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let data=[];
function showFoto(u){if(!u)return;document.getElementById('bigFoto').src=u;document.getElementById('fotoModal').style.display='flex';}
async function load(){
 try{
  document.getElementById('status').innerText='Menghubungkan Supabase...';
  let {data:d,error}=await supa.from('anggota').select('*').order('tgl_lahir',{ascending:true});
  if(error) throw error;
  data=d||[];
  document.getElementById('status').innerText='Total: '+data.length+' data - OK - Rochayanik posisi 3';
  renderData();
  renderPohon();
 }catch(e){
  document.getElementById('status').innerText='ERROR: '+e.message;
  document.getElementById('pohonView').innerText='ERROR: '+e.message;
 }
}
function renderData(){
 let list=document.getElementById('list');list.innerHTML='';
 let s=[...data].sort((a,b)=>(a.tgl_lahir||'').localeCompare(b.tgl_lahir||''));
 let i=s.findIndex(x=>x.nama.toLowerCase().includes('rochayanik')); if(i>2){let[t]=s.splice(i,1);s.splice(2,0,t);}
 s.forEach(r=>{
  let d=document.createElement('div');d.className='row';
  d.innerHTML=`<div>${r.nama} (${(r.tgl_lahir||'').slice(0,10)}) ayah:${r.ayah||'-'} ibu:${r.ibu||'-'}</div>`;
  list.appendChild(d);
 });
}
function buildTree(){
 let map={};data.forEach(d=>{map[d.nama.toLowerCase().trim()]={...d,children:[]}});
 let anak=new Set();
 data.forEach(d=>{
  let me=d.nama.toLowerCase().trim();let a=(d.ayah||'').toLowerCase().trim();let ib=(d.ibu||'').toLowerCase().trim();
  let p=map[a]||map[ib]||null;
  if(!p&&ib){Object.values(map).forEach(x=>{if(x.pasangan&&x.pasangan.toLowerCase().trim()==ib) p=x;});}
  if(p&&p.nama.toLowerCase().trim()!=me){p.children.push(map[me]);anak.add(me);}
 });
 return Object.values(map).filter(x=>!anak.has(x.nama.toLowerCase().trim()));
}
function box(n,isPas){
 let url=isPas?n.foto_pasangan_url:n.foto_url;
 let nama=isPas?n.pasangan:n.nama;
 let img=url?`<img src="${url}" onclick="showFoto('${url}')">`:`<div class="no">NO</div>`;
 return `<div class="box ${isPas?'dash':''} ${!isPas&&n.nama.toLowerCase().includes('masduki')?'root':''}">${img}<div class="nm" style="${isPas?'color:#b00':''}">${(nama||'').split(' ')[0]}</div></div>`;
}
function nodeHTML(node){
 let pair=`<div class="pair">${box(node,false)}${node.pasangan?box(node,true):''}</div>`;
 let kids='';
 if(node.children&&node.children.length){
  node.children.sort((a,b)=>(a.tgl_lahir||'').localeCompare(b.tgl_lahir||''));
  kids=`<div class="vline"></div><div class="children">${node.children.map(c=>`<div class="node">${nodeHTML(c)}</div>`).join('')}</div>`;
 }
 return `${pair}${kids}`;
}
function renderPohon(){
 try{
  let roots=buildTree();
  let mas=roots.find(r=>r.nama.toLowerCase().includes('masduki'));
  if(mas){document.getElementById('pohonView').innerHTML=`<div class="node">${nodeHTML(mas)}</div>`;}
  else{document.getElementById('pohonView').innerHTML=roots.map(r=>`<div class="node">${nodeHTML(r)}</div>`).join('');}
 }catch(e){document.getElementById('pohonView').innerText='Pohon Error: '+e.message;}
}
function switchTab(t){
 document.getElementById('bData').classList.toggle('active',t=='data');
 document.getElementById('bPohon').classList.toggle('active',t=='pohon');
 document.getElementById('dataWrap').style.display=t=='data'?'block':'none';
 document.getElementById('pohonWrap').style.display=t=='pohon'?'block':'none';
 if(t=='pohon') renderPohon();
}
load();
</script>
</body></html>
