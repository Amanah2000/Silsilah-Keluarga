<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silsilah Keluarga</title>
<style>:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--border:#334155}.light{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--border:#cbd5e1}body{font-family:system-ui;margin:0;background:var(--bg);color:var(--text)}header{padding:12px;background:var(--card);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}.card{background:var(--card);margin:12px;padding:12px;border-radius:12px;border:1px solid var(--border)}input,select,button,textarea{padding:7px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin:2px}.btn{padding:7px 12px;font-weight:bold;cursor:pointer;font-size:12px}.green{background:#16a34a;color:#fff}.blue{background:#2563eb;color:#fff}.red{background:#dc2626;color:#fff}.gray{background:#475569;color:#fff}.orange{background:#ea580c;color:#fff}.node{background:var(--card);border:2px solid #16a34a;border-radius:12px;padding:10px 14px;min-width:160px;text-align:center}.tree{display:flex;flex-direction:column;align-items:center;gap:12px}.tree-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.line{width:2px;height:14px;background:#666}table{width:100%;border-collapse:collapse;margin-top:10px;min-width:800px}th,td{border:1px solid var(--border);padding:6px;font-size:11px;text-align:center}.badge{padding:4px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--border);font-size:11px}
@media print{header,.no-print{display:none!important}body{background:#fff;color:#000}.card{background:#fff;border:none}.node{background:#fff!important;color:#000!important;border:2px solid #000!important}}
</style></head><body>
<header class="no-print"><div><b>🌳 SILSILAH KELUARGA</b><br><small>Aplikasi Keluarga Umum</small></div><div><span id="jamLive" class="badge">--:--:--</span> <button class="btn gray" onclick="toggleDark()">🌙</button> <button class="btn blue" onclick="window.print()">🖨️ Cetak</button></div></header>

<div class="card no-print"><h3 style="margin:0 0 8px">+ Tambah Keluarga</h3><div style="display:flex;flex-wrap:wrap">
<input id="f_nama" placeholder="Nama Anak" style="width:130px"><input id="f_ayah" placeholder="Nama Ayah" style="width:130px"><input id="f_ibu" placeholder="Nama Ibu" style="width:130px"><input id="f_kakek" placeholder="Kakek" style="width:110px"><input id="f_nenek" placeholder="Nenek" style="width:110px"><input id="f_pasangan" placeholder="Pasangan (jika ada)" style="width:130px"><input id="f_anak" placeholder="Jumlah Anak" type="number" style="width:90px"><input id="f_alamat" placeholder="Alamat / Asal" style="flex:1;min-width:140px"><button class="btn green" onclick="tambah()">+ Simpan</button></div><input id="cari" placeholder="🔍 Cari: nama ayah, ibu, anak, alamat..." onkeyup="tampil()" style="width:98%;margin-top:8px;padding:8px"></div>

<div class="card"><div id="pohon" class="tree"></div><div style="overflow-x:auto;margin-top:14px"><table id="tbl"><thead><tr><th>Anak</th><th>Ayah</th><th>Ibu</th><th>Kakek</th><th>Nenek</th><th>Pasangan</th><th>Alamat</th><th class="no-print">Aksi</th></tr></thead><tbody></tbody></table></div></div>

<script>
let data=JSON.parse(localStorage.getItem('silsilahUmum')||'[]');
function updateJam(){document.getElementById('jamLive').innerText=new Date().toLocaleTimeString('id-ID');}setInterval(updateJam,1000);updateJam();
function toggleDark(){document.body.classList.toggle('light');}
function tambah(){let o={nama:document.getElementById('f_nama').value,ayah:document.getElementById('f_ayah').value,ibu:document.getElementById('f_ibu').value,kakek:document.getElementById('f_kakek').value,nenek:document.getElementById('f_nenek').value,pasangan:document.getElementById('f_pasangan').value,anak:document.getElementById('f_anak').value,alamat:document.getElementById('f_alamat').value};if(!o.nama){alert('Isi Nama Anak!');return;}data.push(o);localStorage.setItem('silsilahUmum',JSON.stringify(data));tampil();document.getElementById('f_nama').value='';}
function tampil(){let tb=document.querySelector('#tbl tbody');tb.innerHTML='';let pohon=document.getElementById('pohon');pohon.innerHTML='';let cari=(document.getElementById('cari').value||'').toLowerCase();let fil=data.filter(r=>`${r.nama} ${r.ayah} ${r.ibu} ${r.kakek} ${r.nenek} ${r.pasangan} ${r.alamat}`.toLowerCase().includes(cari));if(fil.length>0){let r=fil[0];pohon.innerHTML=`<div class="tree-row"><div class="node">👴 Kakek<br><b>${r.kakek||'-'}</b></div><div class="node">👵 Nenek<br><b>${r.nenek||'-'}</b></div></div><div class="line"></div><div class="tree-row"><div class="node" style="border-color:#2563eb">👨 Ayah<br><b>${r.ayah||'-'}</b></div><div class="node" style="border-color:#db2777">👩 Ibu<br><b>${r.ibu||'-'}</b></div></div><div class="line"></div><div class="tree-row"><div class="node" style="border-color:#16a34a;background:#dcfce7;color:#000">🧒 ${r.nama}<br><small>Pasangan: ${r.pasangan||'-'} | Anak: ${r.anak||'0'}</small><br><small>${r.alamat||''}</small></div></div>`;}fil.forEach((r,i)=>{let idx=data.indexOf(r);tb.innerHTML+=`<tr><td><b>${r.nama}</b></td><td>${r.ayah}</td><td>${r.ibu}</td><td>${r.kakek}</td><td>${r.nenek}</td><td>${r.pasangan}</td><td>${r.alamat}</td><td class="no-print"><button class="btn blue" onclick="pilih(${idx})">🌳 Lihat</button><button class="btn red" onclick="hapus(${idx})">🗑️</button></td></tr>`;});}
function pilih(i){let r=data[i];document.getElementById('cari').value=r.nama;tampil();}
function hapus(i){if(confirm('Hapus?')){data.splice(i,1);localStorage.setItem('silsilahUmum',JSON.stringify(data));tampil();}}
tampil();
</script></body></html>
