<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silsilah V6 Simple</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#f5f5f0;margin:0;padding:12px}
.card{background:#fff;border-radius:18px;padding:16px;max-width:600px;margin:auto}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:4px 0}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:700;margin-top:6px}
.btn-green{background:#1b7a2d;color:#fff}.btn-red{background:#c62828;color:#fff}
.item{display:flex;justify-content:space-between;align-items:center;background:#fafafa;border:1px solid #eee;border-radius:12px;padding:10px 12px;margin:6px 0}
.item b{cursor:pointer}.badge{padding:4px 10px;border-radius:20px;font-size:13px}.green{background:#e8f5e9}.pink{background:#ffe4e8;border:1px solid #ffb3bc}
/* Modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}.modal-box{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:400px}
.node{border-left:3px solid #1b7a2d;padding-left:10px;margin:10px 0 0 10px}
</style>
</head><body><div class="card">
<h2 style="margin:0 0 8px">🌳 Silsilah V6 Simple</h2>
<input id="q" placeholder="🔍 Cari nama..." oninput="render()">
<div style="display:flex;gap:6px"><input id="nama" placeholder="Nama Baru"><button onclick="tambah()" class="btn btn-green" style="width:110px;margin:4px 0">+ Tambah</button></div>
<div id="list"></div>
<div style="margin-top:14px;border-top:2px solid #eee;padding-top:10px"><b>🌲 Pohon</b><div id="pohon"></div></div>
</div>

<!-- MODAL EDIT - GAK NUMPUK LAGI -->
<div id="modal" class="modal" onclick="if(event.target==this) tutup()"><div class="modal-box">
<h3 style="margin:0 0 10px">✏️ Edit Data</h3>
<input id="e_nama" placeholder="Nama"><input id="e_ayah" placeholder="Ayah"><input id="e_ibu" placeholder="Ibu"><input id="e_pasangan" placeholder="Pasangan">
<button class="btn btn-green" onclick="simpanEdit()">💾 Simpan</button>
<button class="btn" style="background:#eee" onclick="tutup()">Batal</button>
<button class="btn btn-red" onclick="hapusEdit()">🗑️ Hapus Orang Ini</button>
</div></div>

<script>
let sbUrl="https://aftvoyxwsmdcedvxehuh.supabase.co",sbKey=localStorage.getItem('sb_key')||"",client,data=[],editId=null;
async function init(){if(!sbKey){let k=prompt('Anon key:');if(k){localStorage.setItem('sb_key',k);sbKey=k;}}client=supabase.createClient(sbUrl,sbKey);
let {data:rows}=await client.from('anggota').select('*').order('created_at');data=rows||[];render();}
function render(){
let q=(document.getElementById('q').value||'').toLowerCase(),f=data.filter(d=>(d.nama||'').toLowerCase().includes(q));
document.getElementById('list').innerHTML=f.map(d=>`
<div class="item"><div onclick="bukaEdit(${d.id})"><b>${d.nama}</b> ${d.pasangan?` <span class="pink">❤️ ${d.pasangan}</span>`:''} <div style="font-size:11px;color:#888">Ayah:${d.ayah||'-'} Ibu:${d.ibu||'-'} • klik untuk edit</div></div><div style="font-size:18px">✏️</div></div>
`).join('');
let names=new Set(f.map(r=>r.nama.trim())),roots=f.filter(r=>(!r.ayah||!names.has(r.ayah.trim()))&&(!r.ibu||!names.has(r.ibu.trim()))),byParent={};
f.forEach(r=>{if(r.ayah){byParent[r.ayah.trim()]=byParent[r.ayah.trim()]||[];byParent[r.ayah.trim()].push(r);}if(r.ibu){byParent[r.ibu.trim()]=byParent[r.ibu.trim()]||[];if(!byParent[r.ibu.trim()].find(x=>x.id==r.id))byParent[r.ibu.trim()].push(r);}});
function rn(p,d){if(d>10)return'';let ch=[...new Map((byParent[p.nama.trim()]||[]).map(x=>[x.id,x])).values()];return `<div class="node"><span class="badge green">👤 ${p.nama}</span>${p.pasangan?`<span class="badge pink">❤️ ${p.pasangan}</span>`:''}<div style="margin-left:6px">${ch.map(c=>rn(c,d+1)).join('')}</div></div>`}
document.getElementById('pohon').innerHTML=roots.map(r=>rn(r,0)).join('')||'<div style="color:#888">Kosong</div>';
}
async function tambah(){let n=document.getElementById('nama').value.trim();if(!n)return;await client.from('anggota').insert([{nama:n}]);document.getElementById('nama').value='';init();}
function bukaEdit(id){let d=data.find(x=>x.id==id);editId=id;document.getElementById('e_nama').value=d.nama;document.getElementById('e_ayah').value=d.ayah||'';document.getElementById('e_ibu').value=d.ibu||'';document.getElementById('e_pasangan').value=d.pasangan||'';document.getElementById('modal').classList.add('show');}
function tutup(){document.getElementById('modal').classList.remove('show');}
async function simpanEdit(){let payload={nama:document.getElementById('e_nama').value.trim(),ayah:document.getElementById('e_ayah').value.trim()||null,ibu:document.getElementById('e_ibu').value.trim()||null,pasangan:document.getElementById('e_pasangan').value.trim()||null};await client.from('anggota').update(payload).eq('id',editId);tutup();init();}
async function hapusEdit(){if(!confirm('Yakin hapus Pak?'))return;await client.from('anggota').delete().eq('id',editId);tutup();init();}
init();
</script></body></html>
