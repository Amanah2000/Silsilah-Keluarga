<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Silsilah Keluarga Tawar - POHON</title>
<style>
body{font-family:Arial;background:#fff;padding:10px;overflow-x:auto}
#total{font-weight:bold;margin-bottom:10px}
.pohon{text-align:center;min-width:1200px}
.judul{font-size:22px;font-weight:bold;margin-bottom:20px}

/* GARIS */
.garis-v{width:3px;height:25px;background:black;margin:0 auto}
.garis-h{height:3px;background:black;width:100%}

/* KOTAK UMUM */
.kotak{border:2px solid black;background:white;border-radius:8px;
       display:flex;align-items:center;justify-content:center;
       text-align:center;padding:8px}

/* LEVEL 1: Masduki */
.level-1 .kotak{width:500px;height:40px;margin:0 auto}

/* LEVEL 2: Wahyudi & Rochayanik */
.level-2{display:flex;justify-content:center;gap:40px;margin:20px 0}
.level-2 .kotak{width:450px;height:45px}
.level-2 .kotak.kecil{width:160px;height:45px}

/* LEVEL 3: Aditya, Churotul, Muhammad, Ahmad */
.level-3{display:flex;justify-content:center;gap:15px;margin:20px 0}
.level-3 .kotak{width:240px;height:45px;font-size:12px}

/* LEVEL 4: cucu - Azalia dll */
.level-4{display:flex;justify-content:center;gap:10px}
.level-4 .anak-wrap{display:flex;gap:8px;justify-content:center;border-top:3px solid black;padding-top:12px;margin-top:0}
.level-4 .anak{width:110px;height:45px;border:2px solid black;border-radius:6px;
               display:flex;align-items:center;justify-content:center;
               font-size:11px;text-align:center;padding:4px}
</style>
</head>
<body>

<script>

{nama:'Masduki', tgl:'1949-08-06', ayah:'', ibu:''},

{nama:'Awet Setiawan', tgl:'', ayah:'', ibu:'', pasangan:'Rochayanik'},

function getAnak(ayah, ibu){
  return anggota.filter(a=>a.ayah===ayah && a.ibu===ibu).sort((a,b)=>new Date(a.tgl)-new Date(b.tgl));
}

function load(){
  const elTotal = document.getElementById('total');
  const elPohon = document.getElementById('pohon');
  if(!elTotal || !elPohon) return;

  elTotal.innerText = `Total: ${anggota.length} data - OK`;

  const html = `
  <div class="judul">Silsilah Keluarga Tawar - POHON</div>

}
