<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silsilah Masduki - Mini Box</title>
<style>
*{font-family:Consolas,monospace;box-sizing:border-box}
body{margin:0}
.tabs{display:flex;position:sticky;top:0;z-index:10}
.tabs button{flex:1;padding:12px;border:1px solid #000;background:#fff;font-weight:bold;cursor:pointer}
.tabs button.active{background:#000;color:#fff}
#pohonView{padding:8px;overflow:auto;background:#fff;min-height:80vh}
.node-box{border:1px solid #000;padding:2px;background:#fff;display:inline-block}
.node-box.root{border:1.5px solid #000;background:#ffffe0}
.node-foto{width:24px;height:24px;border:1px solid #000;object-fit:cover;cursor:pointer;display:block}
.node-foto.pasangan{border-color:#b00}
.node-no{width:24px;height:24px;border:1px dashed #999;display:flex;align-items:center;justify-content:center;font-size:5px}
.node-n{font-size:6px;font-weight:bold;max-width:46px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.node-t{font-size:5px;text-align:center}
#fotoModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;align-items:center;justify-content:center;padding:10px}
#fotoModal img{max-width:95%;max-height:90%;border:3px solid #fff}
.row{display:flex;gap:8px;padding:6px;border-bottom:1px solid #000;align-items:center;font-size:12px}
.row img{width:36px;height:36px;border:1px solid #000;object-fit:cover}
</style>
</head>
<body>
<div class="tabs"><button id="bData" class="active" onclick="switchTab('data')">DATA</button><button id="bPohon" onclick="switchTab('pohon')">POHON</button></div>
<div id="dataWrap"><input id="cari" placeholder="Cari..." oninput="render()" style="width:100%;padding:10px;border:1px solid #000"><div id="status" style="padding:6px;font-size:11px;background:#ffe;border-bottom:1px solid #000"></div><div id="list"></div></div>
<div id="pohonWrap" style="display:none"><div id="pohonView">Memuat...</div></div>
<div id="fotoModal" onclick="this.style.display='none'"><img id="fotoBig" src=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://aftvoyxwsmdcedvxehuh.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmdHZveXh3c21kY2VkdnhlaHVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMjQ4NzcsImV4cCI6MjEwNTcwMDg3N30.QERB57Nn6mTbUSKWwzVI_a6BVjxt9s77hV_IJFsHstM";
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let data=[];
function showFoto(u){if(!u)return;document.getElementById('fotoBig').src=u;document.getElementById('fotoModal').style.display='flex';}
async function load(){
 document.getElementById('status').innerText='Memuat...';
 let {data:d,error} = await supa.from('anggota').select('*').order('tgl_lahir',{ascending:true});
 if(error){document.getElementById('status').innerText='ERROR: '+error.message;return;}
 data=d||[];
 document.getElementById('status').innerText='Total: '+data.length+' data | Rochayanik posisi 3 ✅';
 render();renderPohon();
}
function render(){
 let q=(document.getElementById('cari').value||'').toLowerCase();
 let f=data.filter(x=>(x.nama||'').toLowerCase().includes(q));
 let s=[...f].sort((a,b)=>(a.tgl_lahir||'9999').localeCompare(b.tgl_lahir||'9999'));
 if(!q){let i=s.findIndex(x=>x.nama.toLowerCase().includes('rochayanik'));if(i>2){let[t]=s.splice(i,1);s.splice(2,0,t);}}
 let list=document.getElementById('list');list.innerHTML='';
 s.forEach(r=>{
  let img=r.foto_url?`<img src="${r.foto_url}" onclick="showFoto('${r.foto_url}')" style="cursor:pointer">`:`<div style="width:36px;height:36px;border:1px solid #000;background:#eee"></div>`;
  let div=document.createElement('div');div.className='row';
  div.innerHTML=`${img}<div><b>${r.nama}</b> <small>(${r.tgl_lahir||''})</small><br><small>ayah:${r.ayah||'-'} ibu:${r.ibu||'-'} | 💑 ${r.pasangan||'-'}</small></div>`;
  list.appendChild(div);
 });
}
function buildTree(){
 let map={};data.forEach(d=>{map[d.nama.toLowerCase().trim()]={...d,children:[]}});
 let anak=new Set();
 data.forEach(d=>{
  let me=d.nama.toLowerCase().trim();let a=(d.ayah||'').toLowerCase().trim();let ib=(d.ibu||'').toLowerCase().trim();
  let p=map[a]||map[ib]||null;
  if(!p&&ib){Object.values(map).forEach(x=>{if(x.pasangan&&x.pasangan.toLowerCase().trim()==ib)p=x;});}
  if(p&&p.nama.toLowerCase().trim()!=me){p.children.push(map[me]);anak.add(me);}
 });
 return Object.values(map).filter(n=>!anak.has(n.nama.toLowerCase().trim()));
}
function nodeHTML(node){
 let f1=node.foto_url?`<img src="${node.foto_url}" class="node-foto" onclick="showFoto('${node.foto_url}')">`:`<div class="node-no">NO</div>`;
 let f2=node.pasangan&&node.foto_pasangan_url?`<img src="${node.foto_pasangan_url}" class="node-foto pasangan" onclick="showFoto('${node.foto_pasangan_url}')">`:`<div class="node-no" style="border-color:#f99">NO</div>`;
 if(!node.pasangan) f2='';
 let b1=`<div style="display:flex;flex-direction:column;align-items:center">${f1}<div class="node-n">${node.nama.split(' ')[0]}</div></div>`;
 let b2=node.pasangan?`<div style="display:flex;flex-direction:column;align-items:center">${f2}<div class="node-n" style="color:#b00">${node.pasangan.split(' ')[0]}</div></div>`:'';
 let kids='';
 if(node.children&&node.children.length){
  node.children.sort((a,b)=>(a.tgl_lahir||'').localeCompare(b.tgl_lahir||''));
  kids=`<div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:6px">${node.children.map(c=>nodeHTML(c)).join('')}</div>`;
 }
 return `<div style="display:flex;flex-direction:column;align-items:center"><div class="node-box ${node.nama.toLowerCase().includes('masduki')?'root':''}"><div style="display:flex;gap:3px">${b1}${b2}</div></div>${node.children&&node.children.length?`<div style="width:1px;height:6px;background:#000"></div>${kids}`:''}</div>`;
}
function renderPohon(){
 let roots=buildTree();
 if(!roots.length){document.getElementById('pohonView').innerHTML='Data kosong';return;}
 let m=roots.find(r=>r.nama.toLowerCase().includes('masduki'));
 if(m){document.getElementById('pohonView').innerHTML=`<div style="display:flex;justify-content:center">${nodeHTML(m)}</div>`;}
 else{document.getElementById('pohonView').innerHTML=roots.map(r=>`<div style="margin-bottom:8px;display:flex;justify-content:center">${nodeHTML(r)}</div>`).join('');}
}
function switchTab(t){document.getElementById('bData').classList.toggle('active',t=='data');document.getElementById('bPohon').classList.toggle('active',t=='pohon');document.getElementById('dataWrap').style.display=t=='data'?'block':'none';document.getElementById('pohonWrap').style.display=t=='pohon'?'block':'none';if(t=='pohon')renderPohon();}
load();
</script>
</body></html>
