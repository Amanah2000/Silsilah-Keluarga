<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silsilah Keluarga Wahyudi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:monospace}body{margin:0;background:#fff}
.header{display:flex;border-bottom:2px solid #000;position:sticky;top:0;background:#fff;z-index:10}
.tab{flex:1;padding:14px;text-align:center;font-weight:700;cursor:pointer;border:none;background:#fff}
.tab.active{background:#000;color:#fff}
.page{display:none;padding:12px;max-width:800px;margin:auto}.page.show{display:block}
input{width:100%;padding:11px;border:1px solid #000;margin:4px 0}
.btn{padding:11px 14px;border:1px solid #000;background:#fff;font-weight:700;cursor:pointer}
.btn-black{background:#000;color:#fff;width:100%}
.item{border:1px solid #000;padding:8px 10px;margin:6px 0;display:flex;justify-content:space-between;cursor:pointer}
.box{display:inline-block;border:1px solid #000;padding:5px 9px;background:#fff;margin:2px 0}
.node{margin-left:18px;border-left:1px solid #000;padding-left:14px;margin-top:10px;position:relative;break-inside:avoid;page-break-inside:avoid}
.line{position:absolute;left:-1px;top:12px;width:14px;height:1px;background:#000}
.family{break-inside:avoid;margin-bottom:10px}
.title{text-align:left;border:none;border-bottom:2px solid #000;padding:0 0 8px;margin:0 0 14px;break-after:avoid}
.title b{font-size:18px}.title small{font-size:12px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}.modal-box{background:#fff;border:1px solid #000;padding:14px;width:100%;max-width:400px}
.print-wrap{border:1px solid #000;padding:14px}
.view-badge{display:none;text-align:center;font-size:11px;padding:6px;background:#eee;border-bottom:1px solid #000}
@media print{.header,.no-print,.view-badge{display:none !important}@page{margin:10mm}.print-wrap{border:1px solid #000 !important}}
</style>
</head><body>

<div class="view-badge" id="viewBadge">MODE LIHAT SAJA - Tidak bisa edit</div>

<div class="header" id="header">
<button id="t1" class="tab active" onclick="showPage(1)">DATA</button>
<button id="t2" class="tab" onclick="showPage(2)">POHON</button>
</div>

<div id="page1" class="page show">
<div class="no-print">
<input id="q" placeholder="Cari nama..." oninput="render()">
<div style="display:flex;gap:6px"><input id="nama" placeholder="Nama Baru"><button onclick="tambah()" class="btn btn-black" style="width:110px;margin:4px 0">+ Tambah</button></div>
</div>
<div id="list"></div>
</div>

<div id="page2" class="page">
<div class="print-wrap">
<div class="title"><b>Silsilah Keluarga Wahyudi</b><br><small>3 Generasi • 11 Anggota • 24 Sep 2026</small></div>
<div id="pohon"></div>
</div>
<div class="no-print" id="actionBtn" style="margin-top:12px;display:flex;gap:8px">
<button class="btn" onclick="showPage(1)">← Kembali</button>
<button class="btn btn-black" onclick="window.print()">Cetak / Simpan PDF</button>
</div>
<div class="no-print" style="margin-top:10px;display:flex;gap:6px">
<input id="shareLink" readonly style="font-size:11px">
<button class="btn" style="padding:8px" onclick="copyLink()">Copy Link Lihat</button>
</div>
</div>

<div id="modal" class="modal" onclick="if(event.target==this) tutup()"><div class="modal-box">
<b>EDIT DATA</b><br><br>
<input id="e_nama" placeholder="Nama"><input id="e_ayah" placeholder="Ayah"><input id="e_ibu" placeholder="Ibu"><input id="e_pasangan" placeholder="Pasangan">
<button class="btn btn-black" style="margin-top:8px" onclick="simpanEdit()">Simpan</button>
<button class="btn" style="width:100%;margin-top:6px" onclick="tutup()">Batal</button>
</div></div>

<script>
const isView = new URLSearchParams(location.search).get('view') === '1';
let sbUrl="https://aftvoyxwsmdcedvxehuh.supabase.co",sbKey=localStorage.getItem('sb_key')||"",client,data=[],editId=null;

function showPage(n){
if(isView) n=2;
document.getElementById('page1').classList.toggle('show',n==1);
document.getElementById('page2').classList.toggle('show',n==2);
document.getElementById('t1').classList.toggle('active',n==1);
document.getElementById('t2').classList.toggle('active',n==2);
if(n==2)render();
}
async function init(){
if(!sbKey&&!isView){let k=prompt('Anon key:');if(k){localStorage.setItem('sb_key',k);sbKey=k;}}
if(sbKey) client=supabase.createClient(sbUrl,sbKey);
else client=supabase.createClient(sbUrl,"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmdHZveXh3c21kY2VkdnhlaHVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg3OTcxNjUsImV4cCI6MjA3NDM3MzE2NX0.5a5v3N2y7..."); 
let{data:rows}=await client.from('anggota').select('*').order('created_at');data=rows||[];
if(isView){
document.getElementById('header').style.display='none';
document.getElementById('viewBadge').style.display='block';
document.getElementById('actionBtn').innerHTML='<button class="btn btn-black" onclick="window.print()">Cetak / Simpan PDF</button>';
document.getElementById('page1').style.display='none';
document.getElementById('page2').classList.add('show');
}
document.getElementById('shareLink').value=location.origin+location.pathname+"?view=1";
render();
}
function render(){
let q=(document.getElementById('q').value||'').toLowerCase();
let f=data.filter(d=>(d.nama||'').toLowerCase().includes(q));
if(!isView){
document.getElementById('list').innerHTML=f.map(d=>`<div class="item" onclick="bukaEdit(${d.id})"><div><b>${d.nama}</b> ${d.pasangan?`+ ${d.pasangan}`:''}</div><div>></div></div>`).join('');
}
let names=new Set(data.map(r=>r.nama.trim())),roots=data.filter(r=>(!r.ayah||!names.has(r.ayah.trim()))&&(!r.ibu||!names.has(r.ibu.trim()))),byParent={};
data.forEach(r=>{if(r.ayah){byParent[r.ayah.trim()]=byParent[r.ayah.trim()]||[];byParent[r.ayah.trim()].push(r);}if(r.ibu){byParent[r.ibu.trim()]=byParent[r.ibu.trim()]||[];if(!byParent[r.ibu.trim()].find(x=>x.id==r.id))byParent[r.ibu.trim()].push(r);}});
function rn(p,d){if(d>15)return'';let ch=[...new Map((byParent[p.nama.trim()]||[]).map(x=>[x.id,x])).values()];
return `<div class="node"><div class="line"></div><span class="box">${p.nama} ${p.pasangan?`+ ${p.pasangan}`:''}</span><div>${ch.map(c=>rn(c,d+1)).join('')}</div></div>`}
function familyBlock(r){return `<div class="family">${rn(r,0)}</div>`}
document.getElementById('pohon').innerHTML=roots.map(r=>familyBlock(r)).join('')||'Kosong';
}
async function tambah(){if(isView)return;let n=document.getElementById('nama').value.trim();if(!n)return;await client.from('anggota').insert([{nama:n}]);document.getElementById('nama').value='';init();}
function bukaEdit(id){if(isView)return;let d=data.find(x=>x.id==id);editId=id;document.getElementById('e_nama').value=d.nama;document.getElementById('e_ayah').value=d.ayah||'';document.getElementById('e_ibu').value=d.ibu||'';document.getElementById('e_pasangan').value=d.pasangan||'';document.getElementById('modal').classList.add('show');}
function tutup(){document.getElementById('modal').classList.remove('show');}
async function simpanEdit(){let p={nama:document.getElementById('e_nama').value.trim(),ayah:document.getElementById('e_ayah').value.trim()||null,ibu:document.getElementById('e_ibu').value.trim()||null,pasangan:document.getElementById('e_pasangan').value.trim()||null};await client.from('anggota').update(p).eq('id',editId);tutup();init();}
function copyLink(){let i=document.getElementById('shareLink');i.select();document.execCommand('copy');alert('Link disalin Pak!');}
init();
</script></body></html>
