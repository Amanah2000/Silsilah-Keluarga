<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silsilah V3.1 Fix</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#f5f5f0;margin:0;padding:12px}.card{background:#fff;border-radius:18px;padding:16px;max-width:650px;margin:auto}.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:700;margin:5px 0}.btn-green{background:#1b7a2d;color:#fff}.btn-red{background:#c62828;color:#fff} input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:5px 0} #status{padding:10px;border-radius:10px;margin:8px 0}</style>
</head><body><div class="card">
<h2>🌳 Silsilah V3.1 ❤️ Fix</h2>
<div id="status" style="display:none"></div>
<input id="q" placeholder="🔍 Cari..." oninput="render()">
<div id="setupBox" style="display:none;background:#eef;border-radius:12px;padding:12px;margin:8px 0">
<b>Setup Supabase Pak:</b><br>
<input id="sbUrl" placeholder="https://xxx.supabase.co">
<input id="sbKey" placeholder="eyJ... anon key panjang">
<button class="btn btn-green" onclick="saveSetup()">💾 Simpan & Reload</button>
<div style="font-size:12px;color:#666">Ambil di Supabase -> Settings -> API -> anon public key</div>
</div>
<div id="mainBox">
<input id="nama" placeholder="Nama Lengkap">
<div style="display:flex;gap:6px"><input id="ayah" placeholder="Ayah"><input id="ibu" placeholder="Ibu"></div>
<input id="pasangan" placeholder="Pasangan (Mimin)">
<button class="btn btn-green" id="btnTambah" onclick="tambah()">+ Tambah / Update</button>
<button class="btn" id="btnBatal" style="display:none;background:#eee" onclick="batalEdit()">Batal Edit</button>
<div id="list"></div>
<div style="margin-top:16px;border-top:2px solid #eee;padding-top:10px"><b>🌲 Pohon</b><div id="pohon"></div></div>
<hr><button class="btn btn-red" onclick="resetSetup()">Reset Setup</button>
</div></div>
<script>
let sbUrl=localStorage.getItem('sb_url')||"https://aftvoyxwsmdcedvxehuh.supabase.co";
let sbKey=localStorage.getItem('sb_key')||"";
let client=null,data=[],editId=null;
function showStatus(m,e){let el=document.getElementById('status');el.style.display='block';el.style.background=e?'#f8d7da':'#d4edda';el.innerHTML=m;}
function saveSetup(){let u=sbUrlEl.value.trim(),k=sbKeyEl.value.trim();if(!u||!k)return alert('Isi URL dan Key Pak!');localStorage.setItem('sb_url',u);localStorage.setItem('sb_key',k);location.reload();}
function resetSetup(){if(confirm('Reset Pak?')){localStorage.clear();location.reload();}}
const sbUrlEl=document.getElementById('sbUrl'), sbKeyEl=document.getElementById('sbKey');
function check(){if(!sbKey){document.getElementById('setupBox').style.display='block';showStatus('⚠️ Key belum ada Pak! Isi dulu Pak anon key dari Supabase -> Settings -> API',true);sbUrlEl.value=sbUrl;return false;}try{client=supabase.createClient(sbUrl,sbKey);document.getElementById('setupBox').style.display='none';sbUrlEl.value=sbUrl;sbKeyEl.value=sbKey;return true;}catch(e){showStatus('Error: '+e.message,true);return false;}}
async function load(){if(!check())return;showStatus('⏳ Loading Pak...');const{data:rows,error}=await client.from('anggota').select('*').order('created_at');if(error){showStatus('❌ '+error.message+'<br>Jalankan: ALTER TABLE anggota ADD COLUMN pasangan TEXT;',true);return;}data=rows||[];showStatus('✅ Ada '+data.length+' data Pak','');setTimeout(()=>{document.getElementById('status').style.display='none'},2000);render();}
function render(){let q=document.getElementById('q').value.toLowerCase(),f=data.filter(d=>d.nama.toLowerCase().includes(q)),html='';f.forEach(d=>{html+=`<div style="background:#fafafa;border:1px solid #eee;border-radius:14px;padding:12px;margin:8px 0"><b>${d.nama}</b> ${d.pasangan?'❤️ '+d.pasangan:''}<div style="color:#666;font-size:13px">Ayah:${d.ayah||'-'} Ibu:${d.ibu||'-'} ${d.pasangan?'| Pas:'+d.pasangan:''}</div><div style="display:flex;gap:6px;margin-top:6px"><button style="flex:1" onclick="mulaiEdit(${d.id})">✏️ Edit</button><button style="flex:1" onclick="hapus(${d.id})">🗑️ Hapus</button></div></div>`});document.getElementById('list').innerHTML=html;let names=new Set(f.map(r=>r.nama)),roots=f.filter(r=>(!r.ayah||!names.has(r.ayah))&&(!r.ibu||!names.has(r.ibu))),byParent={};f.forEach(r=>{if(r.ayah){byParent[r.ayah]=byParent[r.ayah]||[];byParent[r.ayah].push(r);}if(r.ibu){byParent[r.ibu]=byParent[r.ibu]||[];if(!byParent[r.ibu].find(x=>x.id==r.id))byParent[r.ibu].push(r);}});function rn(p,d){if(d>12)return'';let ch=byParent[p.nama]||[];ch=[...new Map(ch.map(x=>[x.id,x])).values()];return `<div style="border-left:3px solid #1b7a2d;padding-left:12px;margin:12px 0 0 12px"><div><span style="background:#e8f5e9;padding:6px 12px;border-radius:20px;font-weight:700">👤 ${p.nama}</span>${p.pasangan?`<span style="background:#fff0f3;padding:6px 12px;border-radius:20px;border:1px solid #ffc2c9;margin-left:6px">❤️ ${p.pasangan}</span>`:''}</div><div style="margin-left:8px;border-left:2px dashed #c8e6c9;padding-left:8px">${ch.map(c=>rn(c,d+1)).join('')}</div></div>`}document.getElementById('pohon').innerHTML=roots.map(r=>rn(r,0)).join('');}
async function tambah(){let btn=document.getElementById('btnTambah');btn.disabled=true;btn.textContent='⏳ Menyimpan...';let n=document.getElementById('nama').value.trim(),a=document.getElementById('ayah').value.trim(),i=document.getElementById('ibu').value.trim(),p=document.getElementById('pasangan').value.trim();if(!n){alert('Isi nama');btn.disabled=false;btn.textContent='+ Tambah / Update';return;}let payload={nama:n,ayah:a||null,ibu:i||null,pasangan:p||null};let res;try{if(editId){res=await client.from('anggota').update(payload).eq('id',editId);}else{res=await client.from('anggota').insert([payload]);}if(res.error){alert('Gagal: '+res.error.message);showStatus('❌ '+res.error.message,true);}else{document.getElementById('nama').value='';document.getElementById('ayah').value='';document.getElementById('ibu').value='';document.getElementById('pasangan').value='';editId=null;await load();}}catch(e){alert(e.message);}btn.disabled=false;btn.textContent=editId?'💾 Simpan':'+ Tambah / Update';}
function mulaiEdit(id){let d=data.find(x=>x.id==id);editId=id;document.getElementById('nama').value=d.nama;document.getElementById('ayah').value=d.ayah||'';document.getElementById('ibu').value=d.ibu||'';document.getElementById('pasangan').value=d.pasangan||'';document.getElementById('btnTambah').textContent='💾 Simpan Perubahan';document.getElementById('btnBatal').style.display='block';window.scrollTo({top:0,behavior:'smooth'});}
function batalEdit(){editId=null;document.getElementById('nama').value='';document.getElementById('ayah').value='';document.getElementById('ibu').value='';document.getElementById('pasangan').value='';document.getElementById('btnTambah').textContent='+ Tambah / Update';document.getElementById('btnBatal').style.display='none';}
async function hapus(id){if(!confirm('Hapus Pak?'))return;let{error}=await client.from('anggota').delete().eq('id',id);if(error)alert(error.message);else load();}load();
</script></body></html>
