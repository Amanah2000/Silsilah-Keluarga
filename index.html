<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silsilah V5 Pasangan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#f5f5f0;margin:0;padding:12px}.card{background:#fff;border-radius:18px;padding:16px;max-width:650px;margin:auto}.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:700;margin:5px 0}.btn-green{background:#1b7a2d;color:#fff}.btn-red{background:#c62828;color:#fff}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:5px 0}.node{border-left:3px solid #1b7a2d;padding-left:12px;margin:12px 0 0 12px}.name{background:#e8f5e9;padding:6px 12px;border-radius:20px;font-weight:700}.spouse{background:#ffe4e8;padding:6px 12px;border-radius:20px;border:1px solid #ffb3bc;margin-left:6px;font-weight:700}</style>
</head><body><div class="card">
<h2>🌳 Silsilah V5 ❤️</h2>
<div id="status" style="display:none;padding:10px;border-radius:10px;margin:8px 0"></div>
<input id="q" placeholder="🔍 Cari..." oninput="render()">
<input id="nama" placeholder="Nama Lengkap"><div style="display:flex;gap:6px"><input id="ayah" placeholder="Ayah"><input id="ibu" placeholder="Ibu"></div>
<input id="pasangan" placeholder="Pasangan (contoh: Mimin)">
<button class="btn btn-green" id="btnTambah" onclick="tambah()">+ Tambah / Update</button>
<button class="btn" id="btnBatal" style="display:none;background:#eee" onclick="batalEdit()">Batal Edit</button>
<div id="list"></div><div style="margin-top:16px;border-top:2px solid #eee;padding-top:10px"><b>🌲 Pohon Keluarga</b><div id="pohon"></div></div>
<hr><button class="btn btn-red" onclick="if(confirm('Reset lokal?')){localStorage.removeItem('silsilah_local');location.reload();}">Reset Lokal</button>
</div>
<script>
let sbUrl=localStorage.getItem('sb_url')||"https://aftvoyxwsmdcedvxehuh.supabase.co",sbKey=localStorage.getItem('sb_key')||"",client=null,data=[],editId=null;
function showStatus(m,e){let el=document.getElementById('status');el.style.display='block';el.style.background=e?'#f8d7da':'#d4edda';el.innerHTML=m;setTimeout(()=>el.style.display='none',3000);}
async function init(){if(!sbKey){let k=prompt('Masukkan anon key Supabase Pak (eyJ...):');if(k){localStorage.setItem('sb_key',k);sbKey=k;} }client=supabase.createClient(sbUrl,sbKey);let{data:rows,error}=await client.from('anggota').select('*').order('created_at');if(error){showStatus('❌ '+error.message,true);return;}data=rows;render();showStatus('✅ '+data.length+' data Pak',false);}
function render(){let q=(document.getElementById('q').value||'').toLowerCase(),f=data.filter(d=>(d.nama||'').toLowerCase().includes(q)),html='';f.forEach(d=>{html+=`<div style="background:#fafafa;border:1px solid #eee;border-radius:14px;padding:12px;margin:8px 0"><b>${d.nama}</b> ${d.pasangan?`❤️ ${d.pasangan}`:''}<div style="color:#666;font-size:13px">Ayah:${d.ayah||'-'} Ibu:${d.ibu||'-'} ${d.pasangan?'| Pasangan:'+d.pasangan:''}</div><div style="display:flex;gap:6px;margin-top:6px"><button style="flex:1" onclick="mulaiEdit(${d.id})">✏️ Edit</button><button style="flex:1" onclick="hapus(${d.id})">🗑️ Hapus</button></div></div>`});document.getElementById('list').innerHTML=html;let names=new Set(f.map(r=>r.nama.trim())),roots=f.filter(r=>(!r.ayah||!names.has(r.ayah.trim()))&&(!r.ibu||!names.has(r.ibu.trim()))),byParent={};f.forEach(r=>{if(r.ayah){let a=r.ayah.trim();byParent[a]=byParent[a]||[];byParent[a].push(r);}if(r.ibu){let b=r.ibu.trim();byParent[b]=byParent[b]||[];if(!byParent[b].find(x=>x.id==r.id))byParent[b].push(r);}});function rn(p,d){if(d>12)return'';let ch=byParent[p.nama.trim()]||[];ch=[...new Map(ch.map(x=>[x.id,x])).values()];return `<div class="node"><div><span class="name">👤 ${p.nama}</span>${p.pasangan?`<span class="spouse">❤️ ${p.pasangan}</span>`:''}</div><div style="margin-left:8px;border-left:2px dashed #c8e6c9;padding-left:8px">${ch.map(c=>rn(c,d+1)).join('')}</div></div>`}document.getElementById('pohon').innerHTML=roots.map(r=>rn(r,0)).join('')||'<div style="color:#888">Kosong</div>';}
async function tambah(){let n=document.getElementById('nama').value.trim(),a=document.getElementById('ayah').value.trim(),i=document.getElementById('ibu').value.trim(),p=document.getElementById('pasangan').value.trim();if(!n)return alert('Isi nama');let payload={nama:n,ayah:a||null,ibu:i||null,pasangan:p||null};let res;if(editId){res=await client.from('anggota').update(payload).eq('id',editId);}else{res=await client.from('anggota').insert([payload]).select();}if(res.error){showStatus('❌ '+res.error.message,true);return;}showStatus('✅ Tersimpan Pak!',false);document.getElementById('nama').value='';document.getElementById('ayah').value='';document.getElementById('ibu').value='';document.getElementById('pasangan').value='';editId=null;document.getElementById('btnBatal').style.display='none';init();}
function mulaiEdit(id){let d=data.find(x=>x.id==id);editId=id;document.getElementById('nama').value=d.nama;document.getElementById('ayah').value=d.ayah||'';document.getElementById('ibu').value=d.ibu||'';document.getElementById('pasangan').value=d.pasangan||'';document.getElementById('btnTambah').textContent='💾 Simpan Perubahan';document.getElementById('btnBatal').style.display='block';window.scrollTo({top:0,behavior:'smooth'});}
function batalEdit(){editId=null;document.getElementById('nama').value='';document.getElementById('ayah').value='';document.getElementById('ibu').value='';document.getElementById('pasangan').value='';document.getElementById('btnTambah').textContent='+ Tambah / Update';document.getElementById('btnBatal').style.display='none';}
async function hapus(id){if(!confirm('Hapus Pak?'))return;let{error}=await client.from('anggota').delete().eq('id',id);if(error){showStatus(error.message,true);}else init();}init();
</script></body></html>
